server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://relive-api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://relive-api:8090/health;
  }

  location = /_preview_auth {
    internal;
    proxy_pass http://relive-api:8090/api/v1/preview-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
  }

  location /preview/ {
    auth_request /_preview_auth;
    proxy_pass http://restreamer:8080/memfs/;
    proxy_http_version 1.1;
    proxy_buffering off;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri /index.html;
  }
}
